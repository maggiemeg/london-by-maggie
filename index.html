<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maggie's London</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,700;9..144,800;9..144,900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2EDE2; --surface:#FFFDF8; --ink:#1B2A22; --line:#1B2A22; --muted:#5B685F; --rule:#D8D0BE;
  --forest:#1F5A32; --bubble:#F7B8D8; --hot:#FF6FAE; --sticky:#FFF1A8;
  --hdr-bg:#F7B8D8; --hdr-ink:#1F5A32; --tagc:#8A2260;
  --on-bg:#1F5A32; --on-ink:#FFFDF8; --link:#A32F73; --stamp:#1F5A32; --mapbg:#E4E0D4;
  --display:"Fraunces","Recoleta",Georgia,"Times New Roman",serif;
  --body:"DM Sans","Gill Sans","Trebuchet MS",system-ui,sans-serif;
  --hand:"Caveat","Bradley Hand","Segoe Print","Comic Sans MS",cursive;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#13201A; --surface:#1D2D25; --ink:#F3EEE3; --line:#6E8F78; --muted:#A9B5AB; --rule:#33473B;
    --hdr-bg:#1F5A32; --hdr-ink:#F7B8D8; --tagc:#F7B8D8;
    --on-bg:#F7B8D8; --on-ink:#1B2A22; --link:#F7B8D8; --stamp:#8FE0A6; --mapbg:#1B2B23;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow-x:hidden}
main,.panel,.app{min-width:0;width:100%}
body{font-family:var(--body);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
.app{height:100dvh;display:flex;flex-direction:column;max-width:1200px;margin:0 auto}

/* header */
header{background:var(--hdr-bg);color:var(--hdr-ink);padding:8px 14px 12px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;flex-shrink:0;border-bottom:2px solid var(--line)}
.hand{font-family:var(--hand);font-size:23px;line-height:1;color:var(--tagc);transform:rotate(-2deg);transform-origin:left;margin-bottom:-1px}
header h1{font-family:var(--display);font-weight:900;font-size:clamp(30px,8vw,42px);line-height:.95;letter-spacing:-.8px}
#count{font-size:13.5px;font-weight:700;margin-top:5px;color:var(--ink)}
.region{margin-left:auto;display:flex;gap:6px}
.region button{padding:6px 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:14px}
.region button[aria-pressed="true"]{background:var(--on-bg);color:var(--on-ink)}

main{flex:1;min-height:0;display:flex;flex-direction:column}
#map{height:42dvh;min-height:240px;background:var(--mapbg);flex-shrink:0;z-index:0;border-bottom:2px solid var(--line)}
.panel{flex:1;min-height:0;overflow-y:auto;background:var(--bg);overscroll-behavior:contain}

/* filters */
.filters{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1.5px solid var(--rule)}
.row{display:flex;gap:7px;overflow-x:auto;padding:3px 14px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.row + .row{margin-top:3px}
.chip{flex-shrink:0;padding:6px 13px;border-radius:999px;background:var(--surface);border:2px solid var(--line);color:var(--ink);
  font-size:14px;font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:7px}
.chip svg{margin-left:-7px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.chip.cat{padding-left:9px}
.chip[aria-pressed="true"]{background:var(--on-bg);border-color:var(--on-bg);color:var(--on-ink)}
.chip.hood{border-radius:10px;font-weight:600}
.chip.sub{font-weight:500;font-size:13px;padding:4px 10px;border-style:dashed}
.chip.sub[aria-pressed="true"]{background:var(--hot);border:2px solid var(--line);color:#1B2A22;font-weight:700}

.tools{display:flex;gap:8px;align-items:center;padding:9px 14px 2px}
.tools input{flex:1;min-width:0;padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:15px}
.tools button{padding:8px 14px;border-radius:999px;font-weight:700;font-size:14px;background:var(--surface);border:2px solid var(--line);white-space:nowrap}
.tools button.primary{background:var(--hot);color:#1B2A22}
.tools button[aria-pressed="true"]{background:var(--on-bg);color:var(--on-ink);border-color:var(--on-bg)}

.meta{display:flex;flex-wrap:wrap;gap:6px;justify-content:space-between;align-items:center;padding:10px 14px 2px;color:var(--muted);font-size:13.5px}
.meta button{color:var(--link);font-weight:700;font-size:13.5px}
.sync{display:block;font-size:12.5px}
#note{margin:8px 14px 0;padding:8px 12px;border-radius:6px;background:var(--sticky);color:#1B2A22;font-family:var(--hand);font-size:19px;line-height:1.1;transform:rotate(-.6deg);display:none}
#note button{margin-left:6px;text-decoration:underline;font-weight:700;color:#8A2260;font-family:var(--body);font-size:14px}
#note textarea{display:block;width:100%;margin-top:6px;font:inherit;font-size:12px;height:70px}
.warn{margin:8px 14px 0;padding:8px 12px;border-radius:8px;background:var(--surface);border:2px solid var(--hot);font-size:13.5px}

/* spot cards: like a travel ticket, sticker on the left */
#list{list-style:none;padding:8px 14px calc(28px + env(safe-area-inset-bottom));display:grid;gap:14px}
.card{display:grid;grid-template-columns:68px 1fr;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px 14px 14px 10px;position:relative}
.card.sel{box-shadow:4px 4px 0 var(--hot)}
.stkwrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding-right:8px;border-right:2px dashed var(--rule)}
.stkwrap svg{filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));transform:rotate(-7deg)}
.stamp{font-family:var(--display);font-weight:800;font-size:12.5px;color:var(--stamp);border:2px solid var(--stamp);border-radius:6px;padding:0 6px;transform:rotate(-8deg);line-height:1.35}
.top{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.name{font-family:var(--display);font-weight:800;font-size:19px;line-height:1.15;letter-spacing:-.2px}
.where{color:var(--muted);font-size:14px;margin-top:2px;font-weight:500}
.dist{flex-shrink:0;font-size:12.5px;font-weight:700;background:var(--bubble);color:#1B2A22;padding:3px 9px;border-radius:999px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.tag{font-size:12.5px;padding:2px 10px;border-radius:999px;font-weight:700;border:1.5px solid #1B2A22}
.tag.plain{background:transparent;color:var(--ink);font-weight:500;border:1.5px solid var(--rule)}
.note-txt{margin-top:10px;display:inline-block;background:var(--sticky);color:#1B2A22;font-family:var(--hand);font-size:19px;line-height:1.1;padding:5px 11px;transform:rotate(-1.2deg);box-shadow:1px 2px 0 rgba(0,0,0,.15)}
.tube{margin-top:8px;font-size:13.5px;color:var(--muted)}
.price{margin-left:8px;color:var(--muted);font-weight:600;font-family:var(--body);font-size:15px}
.acts{display:flex;gap:8px;margin-top:12px}
.acts a,.acts button{flex:1;text-align:center;text-decoration:none;padding:9px 10px;border-radius:999px;font-weight:700;font-size:14.5px;
  border:2px solid var(--line);color:var(--ink);background:transparent;display:block}
.acts a.go{background:var(--on-bg);border-color:var(--on-bg);color:var(--on-ink)}
.acts button[aria-pressed="true"]{background:#CFEFD6;border-color:#2E8B4A;color:#124B27}
.mine{margin-top:12px;padding-top:10px;border-top:2px dashed var(--rule)}
.stars{display:flex;gap:0;align-items:center}
.stars span{font-size:13.5px;color:var(--muted);margin-right:8px;font-weight:600}
.stars button{font-size:27px;line-height:1;padding:2px 3px;color:#B9B3A3;border-radius:4px}
.stars button.on{color:#F2A900}
.mine textarea{display:block;width:100%;margin-top:8px;padding:8px 10px;border-radius:10px;border:2px solid var(--rule);background:var(--bg);color:var(--ink);font:inherit;font-size:15px;resize:vertical;min-height:58px}
.about{display:flex;gap:12px;margin-top:12px;align-items:flex-start}
.about:empty{display:none}
.about img{width:96px;height:92px;flex-shrink:0;object-fit:cover;background:#fff;padding:4px 4px 12px;border:1px solid var(--rule);box-shadow:0 2px 5px rgba(0,0,0,.25);transform:rotate(-3deg);border-radius:2px}
.abt p{font-size:14.5px;line-height:1.35}
.abt a,.osm a{font-size:13px;color:var(--link);font-weight:700}
.moreinfo{margin-top:11px;font-size:14px;font-weight:700;color:var(--link);text-decoration:underline;text-underline-offset:3px}
.osm:empty{display:none}
.osm{margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--bg);font-size:14px;line-height:1.4}
.osm ul{list-style:none;margin:4px 0 0}
.osm li{padding:1px 0}
.osm b{font-weight:700}
.credits{padding:0 14px calc(28px + env(safe-area-inset-bottom));font-size:12.5px;color:var(--muted)}
.credits a{color:var(--link)}
.empty{text-align:center;padding:36px 20px;color:var(--muted)}
.empty button{margin-top:10px;padding:9px 18px;border-radius:999px;background:var(--on-bg);color:var(--on-ink);font-weight:700}

/* map stickers */
.pin{background:none;border:0}
.pin .stk{position:relative;width:40px;height:40px;transform:rotate(var(--r));filter:drop-shadow(0 2px 2px rgba(0,0,0,.4));transition:transform .15s}
.pin .stk svg{display:block}
.pin.sel .stk{transform:rotate(0deg) scale(1.4)}
.pin .ck{position:absolute;right:-2px;bottom:-2px;width:15px;height:15px;border-radius:50%;background:#1F5A32;color:#fff;border:2px solid #fff;font-size:9px;font-style:normal;font-weight:700;display:grid;place-items:center}
.me{width:16px;height:16px;border-radius:50%;background:#1E7CF2;border:3px solid #fff;box-shadow:0 0 0 6px rgba(30,124,242,.25)}

@media (min-width:900px){
  main{flex-direction:row-reverse}
  #map{height:auto;flex:1;min-height:0;border-bottom:0;border-right:0;border-left:2px solid var(--line)}
  .panel{flex:0 0 460px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>

      <div id="note" role="status"></div>

    </section>
  </main>
</div>

function parseCSV(t){
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){ if(c=='"'){ if(t[i+1]=='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c=='"') q=true;
    else if(c==','){row.push(f);f="";}
    else if(c=='\n'||c=='\r'){ if(c=='\r'&&t[i+1]=='\n') i++; row.push(f);rows.push(row);row=[];f=""; }
    else f+=c;
  }
  if(f!==""||row.length){row.push(f);rows.push(row);}
  return rows;
}
const ALIASES = {
  name:["place name","name","place"], hood:["location","neighborhood","neighbourhood","area"],
  cat:["category"], sub:["subcategory","sub-category","sub category","type"],
  link:["google map link","google maps link","map link","link"], note:["notes","note"],
  visited:["visited?","visitied?","visited","visit"], lat:["lat","latitude"], lng:["lng","lon","long","longitude"],
  region:["region"], zone:["zone"], price:["price"], tube:["nearest station","station","tube"]
};
function sheetToSpots(table){
  const head = table[0].map(h=>h.trim().toLowerCase());
  const idx = {};
  for(const k in ALIASES){ idx[k] = head.findIndex(h=>ALIASES[k].includes(h)); }
  const get = (r,k)=> idx[k]>=0 ? (r[idx[k]]||"").trim() : "";
  const out=[];
  table.slice(1).forEach((r,n)=>{
    const name=get(r,"name"); if(!name) return;
    const hood=get(r,"hood"), link=get(r,"link");
    let lat=parseFloat(get(r,"lat")), lng=parseFloat(get(r,"lng"));
    if(isNaN(lat)||isNaN(lng)){ const m=link.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||link.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/); lat=m?+m[1]:NaN; lng=m?+m[2]:NaN; }
    out.push(makeSpot({name,hood,cats:get(r,"cat").split(/[,\n]/).map(x=>x.trim()).filter(Boolean),subs:get(r,"sub").split(/[,\n]/).map(s=>s.trim()).filter(Boolean),
      note:get(r,"note"),link,lat,lng,region:get(r,"region"),zone:get(r,"zone"),price:get(r,"price"),tube:get(r,"tube"),
      sheetVisited:/^(yes|y|true|visited|done|✓|x)/i.test(get(r,"visited")),src:n,fromSheet:true}));
  });
  return {spots:out,nData:table.length-1};
}
function makeSpot(o){
  const h=(o.hood||"").toLowerCase();
  let zone=o.zone, region=o.region;
  if(!region){
    const inLondon = Object.values(ZONE_KEYS).some(a=>a.some(k=>h.includes(k)));
    region = inLondon ? "London" : (BEYOND_KEYS.some(k=>h.includes(k)) ? "Beyond" : "London");
  }
  region = /^lon/i.test(region) ? "London" : "Beyond";
  if(region==="London" && !zone){
    zone = Object.keys(ZONE_KEYS).find(z=>ZONE_KEYS[z].some(k=>h.includes(k))) || "Other";
  }
  if(region==="Beyond") zone="—";
  const known = SAMPLE_BY_NAME[(o.link||"").trim().toLowerCase()] || SAMPLE_BY_NAME[o.name.trim().toLowerCase()];
  let lat=o.lat, lng=o.lng, approx=false;
  if((isNaN(lat)||isNaN(lng)) && known){ lat=known.lat; lng=known.lng; }
  if(!o.tube && known) o.tube=known.tube;
  return {name:o.name,hood:o.hood||"Unsorted",zone,region,cat:(o.cats&&o.cats[0])||o.cat||"Other",cats:(o.cats&&o.cats.length?o.cats:[o.cat||"Other"]),subs:o.subs||[],note:o.note||"",
    lat:isNaN(lat)?null:lat,lng:isNaN(lng)?null:lng,tube:o.tube||"",link:o.link||"",price:o.price||"",
    sheetVisited:!!o.sheetVisited,src:o.src,hadSheetCoords:o.fromSheet&&!isNaN(o.lat)&&!isNaN(o.lng),
    key:(o.name+"|"+(o.hood||"")+"|"+((o.cats&&o.cats[0])||o.cat||"")).toLowerCase()};
}

const inRegion = s => S.region==="London" ? s.region==="London" : s.region!=="London";
function filtered(extra={}){
  const f={...S,...extra}, q=f.q.trim().toLowerCase();
  const out=SPOTS.filter(s=>{
    if(!inRegion(s)) return false;
    if(S.region==="London" && f.zone!=="All" && s.zone!==f.zone) return false;
    if(f.hood!=="All" && s.hood!==f.hood) return false;
    if(f.cat!=="All" && !s.cats.includes(f.cat)) return false;
    if(f.sub!=="All" && !s.subs.includes(f.sub)) return false;
    const v=isVisited(s);
    if(f.status==="todo" && v) return false;
    if(f.status==="done" && !v) return false;
    if(q && !(s.name+" "+s.hood+" "+s.note+" "+s.subs.join(" ")+" "+s.cats.join(" ")).toLowerCase().includes(q)) return false;
    return true;
  });
  if(S.user){
    out.forEach(s=>{s._d = s.lat==null?Infinity:dist(S.user,[s.lat,s.lng]);});
    if(S.near) out.sort((a,b)=>a._d-b._d);
  }
  return out;
}
function dist(a,b){
  const R=6371000,t=Math.PI/180,dLat=(b[0]-a[0])*t,dLng=(b[1]-a[1])*t;
  const h=Math.sin(dLat/2)**2+Math.cos(a[0]*t)*Math.cos(b[0]*t)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function distLabel(m){
  if(!isFinite(m)) return "";
  if(m>50000) return Math.round(m/1000)+" km";
  const mins=Math.max(1,Math.round(m/80));
  return mins<=45 ? mins+" min walk" : (m/1000).toFixed(1)+" km";
}

      const dir=/^https?:\/\//.test(s.link) ? s.link
        : "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(s.name+" "+(s.region==="London"?"London":s.hood));
      return `<li class="card ${S.sel===s.id?"sel":""} ${v?"done":""}" id="spot-${s.id}" data-id="${s.id}">
        <div class="stkwrap">${sticker(s.cat,58)}${v?'<span class="stamp">Visited</span>':""}</div>
        <div class="body">
          <div class="top">
            <div><div class="name">${esc(s.name)}${s.price?`<span class="price">${esc(s.price)}</span>`:""}</div><div class="where">${esc(s.hood)}</div></div>
            ${S.user&&isFinite(s._d)?`<span class="dist">${distLabel(s._d)}</span>`:""}
          </div>
          <div class="tags">${s.cats.map(x=>`<span class="tag" style="background:${cs(x).c};color:${cs(x).i}">${esc(x)}</span>`).join("")}${s.subs.map(x=>`<span class="tag plain">${esc(x)}</span>`).join("")}</div>
          ${s.note?`<p class="note-txt">${esc(s.note)}</p>`:""}
          ${s.tube?`<p class="tube">Nearest station: ${esc(s.tube)}</p>`:""}
          ${s.lat==null?`<p class="tube">Finding this spot on the map…</p>`:""}
          <div class="about" data-about="${s.id}">${aboutHtml(s)}</div>
          <div class="acts">
            <a class="go" href="${esc(dir)}" target="_blank" rel="noopener">Get directions</a>
            <button data-visit="${s.id}" aria-pressed="${v}">${v?"Visited":"Mark visited"}</button>
          </div>
          <button class="moreinfo" data-osm="${s.id}" aria-expanded="${S.osmOpen.has(s.key)}">${S.osmOpen.has(s.key)?"Hide hours & contact":"Hours & contact"}</button>
          <div class="osm" data-osmbox="${s.id}">${osmHtml(s)}</div>
          ${v?mineHtml(s):""}
        </div>
      </li>`;
    }).join("");
  }
  const ids=new Set(list.map(s=>s.id));
  SPOTS.forEach(s=>{
    const m=markers[s.id]; if(!m) return;
    if(ids.has(s.id)){ m.setIcon(pinIcon(s)); if(!map.hasLayer(m)) m.addTo(map); m.setZIndexOffset(S.sel===s.id?1000:0); }
    else if(map.hasLayer(m)) map.removeLayer(m);
  });
  observeCards();
}
function fit(){
  const list=filtered().filter(s=>s.lat!=null);
  if(!list.length) return;
  if(list.length===1) return map.setView([list[0].lat,list[0].lng],15);
  const pts=list.map(s=>[s.lat,s.lng]);
  if(S.user) pts.push(S.user);
  map.fitBounds(L.latLngBounds(pts).pad(0.15),{maxZoom:15});
}
function refresh(doFit=true){ renderFilters(); renderList(); if(doFit) fit(); }

/* ---------- ACTIONS ---------- */
function select(id,scroll,fly){
  S.sel=id; const s=SPOTS[id]; renderList();
  if(fly && s.lat!=null) map.flyTo([s.lat,s.lng],Math.max(map.getZoom(),14),{duration:.6});
  if(scroll){ const el=$("spot-"+id); if(el) el.scrollIntoView({behavior:"smooth",block:"center"}); }
}
function clearFilters(){
  Object.assign(S,{zone:"All",hood:"All",cat:"All",sub:"All",status:"all",q:"",near:false});
  $("q").value=""; hideNote(); refresh();
}
function showNote(t,withEl){ const n=$("note"); n.textContent=t; if(withEl) n.appendChild(withEl); n.style.display="block"; }
function hideNote(){ $("note").style.display="none"; }

document.addEventListener("click",e=>{
  const chipEl=e.target.closest(".chip");
  if(chipEl){
    const k=chipEl.dataset.k,v=chipEl.dataset.v;
    if(k==="zone"){S.zone=v;S.hood="All";}
    if(k==="hood") S.hood=v;
    if(k==="cat"){S.cat=v;S.sub="All";}
    if(k==="sub") S.sub=v;
    S.sel=null; refresh(); return;
  }
  const rb=e.target.closest("[data-region]");
  if(rb){
    Object.assign(S,{region:rb.dataset.region,zone:"All",hood:"All",cat:"All",sub:"All",sel:null});
    document.querySelectorAll("[data-region]").forEach(b=>b.setAttribute("aria-pressed",b===rb));
    refresh(); return;
  }
  const vb=e.target.closest("[data-visit]");
  if(vb){
    const s=SPOTS[+vb.dataset.visit];
    S.override.set(s.key,!isVisited(s)); saveMine();
    const y=$("panel").scrollTop; refresh(false); $("panel").scrollTop=y; return;
  }
  const ob=e.target.closest("[data-osm]");
  if(ob){
    const sp=SPOTS[+ob.dataset.osm];
    if(S.osmOpen.has(sp.key)) S.osmOpen.delete(sp.key);
    else { S.osmOpen.add(sp.key); if(!OSM[sp.key]||OSM[sp.key].state==="error") fetchOsm(sp); }
    updateCard(sp); return;
  }
  const rt=e.target.closest("[data-rate]");
  if(rt){
    const [id,n]=rt.dataset.rate.split(":").map(Number), sp=SPOTS[id];
    const m=S.my[sp.key]=S.my[sp.key]||{};
    m.rating = m.rating===n ? 0 : n;
    S.override.set(sp.key,true); saveMine();
    const y=$("panel").scrollTop; refresh(false); $("panel").scrollTop=y; return;
  }
  const card=e.target.closest(".card");
  if(card && !e.target.closest("a,button,textarea,.mine")) select(+card.dataset.id,false,true);
});
document.addEventListener("change",e=>{
  const t=e.target.closest("[data-note]"); if(!t) return;
  const sp=SPOTS[+t.dataset.note]; (S.my[sp.key]=S.my[sp.key]||{}).note=t.value.trim(); saveMine();
});
$("q").addEventListener("input",e=>{S.q=e.target.value;S.sel=null;refresh();});
$("clear").onclick=clearFilters;
$("refresh").onclick=()=>loadSheet(true);
$("status").onclick=()=>{S.status={all:"todo",todo:"done",done:"all"}[S.status];refresh();};
$("surprise").onclick=()=>{
  const pool=filtered({status:"todo"});
  if(!pool.length) return showNote("You've visited everything that matches. Loosen a filter to find more.");
  hideNote();
  select(pool[Math.floor(Math.random()*pool.length)].id,true,true);
};
$("near").onclick=()=>{
  if(S.near){S.near=false;refresh();return;}
  if(!navigator.geolocation) return showNote("Location isn't available on this device. Pick an area instead.");
  showNote("Finding you…");
  navigator.geolocation.getCurrentPosition(p=>{
    S.user=[p.coords.latitude,p.coords.longitude]; S.near=true; hideNote();
    if(meMarker) map.removeLayer(meMarker);
    meMarker=L.marker(S.user,{icon:L.divIcon({className:"",html:'<div class="me"></div>',iconSize:[16,16]}),interactive:false}).addTo(map);
    refresh(false); map.setView(S.user,14);
  },()=>showNote("Couldn't get your location. Check that location access is on for this page, or pick an area above."),{enableHighAccuracy:true,timeout:10000});
};

/* ---------- LOADING FROM THE SHEET ---------- */
let gen=0, lastLoad=0, nData=0, fromSheet=false;
function setSpots(list){
  Object.values(markers).forEach(m=>map.removeLayer(m)); markers={};
  SPOTS=list; SPOTS.forEach((s,i)=>{s.id=i; addMarker(s);});
  S.sel=null;
  if(S.cat!=="All" && !SPOTS.some(s=>s.cats.includes(S.cat))) S.cat="All";
  refresh(true);
}
async function loadSheet(manual){
  const my=++gen; hideNote();
  if(!SHEET_CSV_URL){
    fromSheet=false; const sn=sheetToSpots(parseCSV(SNAPSHOT_CSV)); setSpots(sn.spots);
    $("sync").textContent="Showing a saved copy of your sheet.";
    return;
  }
  $("sync").textContent="Syncing…";
  try{
    const res=await fetch(SHEET_CSV_URL+(SHEET_CSV_URL.includes("?")?"&":"?")+"_="+Date.now(),{cache:"no-store"});
    if(!res.ok) throw new Error(res.status);
    const parsed=sheetToSpots(parseCSV(await res.text()));
    if(my!==gen) return;
    if(!parsed.spots.length) throw new Error("empty");
    nData=parsed.nData; fromSheet=true; lastLoad=Date.now();
    setSpots(parsed.spots);
    $("sync").textContent="Synced "+new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})+" · "+parsed.spots.length+" spots from your sheet";
    geocodeMissing(my);
  }catch(err){
    if(my!==gen) return;
    if(fromSheet){
      $("sync").textContent="Couldn't refresh. Showing the last synced spots.";
    } else {
      const snap=sheetToSpots(parseCSV(SNAPSHOT_CSV));
      setSpots(snap.spots);
      $("sync").textContent="Showing a saved copy of your sheet from "+SNAPSHOT_DATE+" ("+snap.spots.length+" spots). Live updates need the page hosted online.";
    }
  }
}

/* Spots with no coordinates get looked up on OpenStreetMap, one per second */
async function geocodeMissing(my){
  const todo=SPOTS.filter(s=>s.lat==null);
  let added=0;
  for(const s of todo){
    if(my!==gen) return;
    const qs=[s.name+", "+s.hood+(s.region==="London"?", London":""), s.name+(s.region==="London"?", London":"")];
    for(const q of qs){
      try{
        const r=await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=gb&q="+encodeURIComponent(q));
        const j=await r.json();
        if(j[0]){ s.lat=+j[0].lat; s.lng=+j[0].lon; added++; addMarker(s); renderList(); break; }
      }catch(e){ break; }
      await new Promise(r=>setTimeout(r,1100));
    }
    await new Promise(r=>setTimeout(r,1100));
  }
  if(my!==gen) return;
  if(added || todo.length){ fit(); }
  offerCoordCopy();
}
function offerCoordCopy(){
  const needs=SPOTS.some(s=>s.lat!=null && !s.hadSheetCoords);
  if(!needs || !fromSheet) return;
  const lines=Array.from({length:nData},()=>"\t");
  SPOTS.forEach(s=>{ if(s.lat!=null && s.src!=null) lines[s.src]=s.lat.toFixed(6)+"\t"+s.lng.toFixed(6); });
  const text="Lat\tLng\n"+lines.join("\n");
  const b=document.createElement("button"); b.textContent="Copy coordinates";
  b.onclick=async()=>{
    try{ await navigator.clipboard.writeText(text); b.textContent="Copied. Paste into new Lat and Lng columns."; }
    catch(e){ const t=document.createElement("textarea"); t.value=text; $("note").appendChild(t); t.select(); }
  };
  showNote("Some pins were placed automatically, so they load slowly. Save their coordinates in your sheet to make them instant.",b);
}

/* ---------- Free place info: Wikipedia (photo + blurb) and OpenStreetMap (hours + contact) ---------- */
const INFO_KEY="maggies-london-info-v1", TTL=30*864e5;
let WIKI={}, OSM={};
try{
  const d=JSON.parse(localStorage.getItem(INFO_KEY)||"{}"), now=Date.now();
  for(const k in d.wiki||{}) if(now-d.wiki[k].ts<TTL) WIKI[k]=d.wiki[k];
  for(const k in d.osm||{}) if(now-d.osm[k].ts<TTL) OSM[k]=d.osm[k];
}catch(e){}
function saveInfo(){
  try{
    const keep=o=>Object.fromEntries(Object.entries(o).filter(([,v])=>v.state==="ok"||v.state==="none"));
    localStorage.setItem(INFO_KEY,JSON.stringify({wiki:keep(WIKI),osm:keep(OSM)}));
  }catch(e){}
}
const STOP=new Set(["the","of","and","a","an","in","at","london","st","saint"]);
const norm=t=>String(t).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/&/g," and ").replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim();
const toks=t=>norm(t).split(" ").filter(w=>w&&!STOP.has(w));
function nameMatch(a,b){
  const A=new Set(toks(a)),B=new Set(toks(b));
  if(!A.size||!B.size) return false;
  let inter=0; A.forEach(w=>{ if(B.has(w)) inter++; });
  const small=Math.min(A.size,B.size), big=Math.max(A.size,B.size);
  if(small===1 && big>1) return false;           // one-word names must match exactly
  return inter===small || inter/big>=0.6;
}
const queryName = s => (s.link && !/^https?:/.test(s.link) && s.link.trim()) ? s.link.trim() : s.name;
function shorten(t,max){
  t=(t||"").replace(/\s+/g," ").trim();
  if(t.length<=max) return t;
  const cut=t.slice(0,max), i=Math.max(cut.lastIndexOf(". "),cut.lastIndexOf("; "));
  return i>80 ? cut.slice(0,i+1) : cut.replace(/\s+\S*$/,"")+"…";
}
async function wikiLookup(s){
  const qn=queryName(s);
  const tries=[qn+" "+(s.region==="London"?"London":s.hood), qn];
  for(const q of tries){
    const url="https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=6&gsrsearch="+encodeURIComponent(q)
      +"&prop=extracts|pageimages|coordinates&exintro=1&explaintext=1&exsentences=3&exlimit=max&piprop=thumbnail&pithumbsize=400&colimit=max";
    const r=await fetch(url); if(!r.ok) throw new Error("wiki "+r.status);
    const j=await r.json();
    const pages=Object.values((j.query||{}).pages||{}).sort((a,b)=>a.index-b.index);
    for(const pg of pages){
      if(!pg.extract || /may (also )?refer to/i.test(pg.extract)) continue;
      const t=pg.title.replace(/\(.*?\)/g,"").replace(/,.*$/,"").trim();
      if(!(nameMatch(qn,t)||nameMatch(s.name,t))) continue;
      const c=pg.coordinates&&pg.coordinates[0];
      if(c && s.lat!=null){ if(dist([s.lat,s.lng],[c.lat,c.lon])>5000) continue; }
      else if(!c){
        const ex=pg.extract.toLowerCase(), h=s.hood.toLowerCase().split(" / ")[0];
        if(!(ex.includes("london")||ex.includes(h))) continue;
      }
      return {title:pg.title,extract:shorten(pg.extract,260),thumb:pg.thumbnail?pg.thumbnail.source:"",
              url:"https://en.wikipedia.org/wiki/"+encodeURIComponent(pg.title.replace(/ /g,"_"))};
    }
  }
  return null;
}
const WQ=[], INFLIGHT=new Set(); let active=0;
function queueWiki(s){ if(INFLIGHT.has(s.key)) return; INFLIGHT.add(s.key); WQ.push(s); pump(); }
function pump(){
  while(active<3 && WQ.length){
    const s=WQ.shift(); active++;
    wikiLookup(s)
      .then(r=>{ WIKI[s.key]=r?{state:"ok",...r,ts:Date.now()}:{state:"none",ts:Date.now()}; saveInfo(); })
      .catch(()=>{})
      .finally(()=>{ INFLIGHT.delete(s.key); active--; updateCard(s); pump(); });
  }
}
let io;
function observeCards(){
  if(io) io.disconnect();
  if(!("IntersectionObserver" in window)) return;
  io=new IntersectionObserver(es=>es.forEach(e=>{
    if(!e.isIntersecting) return;
    io.unobserve(e.target);
    const s=SPOTS[+e.target.dataset.id];
    if(s && !WIKI[s.key]) queueWiki(s);
  }),{root:$("panel"),rootMargin:"300px"});
  document.querySelectorAll(".card").forEach(c=>io.observe(c));
}
function aboutHtml(s){
  const i=WIKI[s.key]; if(!i||i.state!=="ok") return "";
  return (i.thumb?`<img src="${esc(i.thumb)}" alt="${esc(i.title)}" loading="lazy" referrerpolicy="no-referrer">`:"")+
    `<div class="abt"><p>${esc(i.extract)}</p><a href="${esc(i.url)}" target="_blank" rel="noopener">Read more on Wikipedia</a></div>`;
}
/* Hours and contact come from OpenStreetMap, looked up only when you tap the button */
async function osmLookup(s){
  if(s.lat==null) return null;
  const qn=queryName(s);
  const main=toks(qn).sort((a,b)=>b.length-a.length)[0];
  if(!main || main.length<3) return null;
  const rx=main.replace(/[aeiou]/g,".").replace(/[^a-z0-9.]/g,"");
  const q=`[out:json][timeout:12];nwr["name"~"${rx}",i](around:600,${s.lat},${s.lng});out tags center 10;`;
  const r=await fetch("https://overpass-api.de/api/interpreter?data="+encodeURIComponent(q));
  if(!r.ok) throw new Error("osm "+r.status);
  const j=await r.json();
  const hit=(j.elements||[]).find(e=>e.tags&&e.tags.name&&(nameMatch(qn,e.tags.name)||nameMatch(s.name,e.tags.name)));
  if(!hit) return null;
  const t=hit.tags, web=t.website||t["contact:website"]||"", ph=t.phone||t["contact:phone"]||"";
  const out={hours:t.opening_hours||"",website:/^https?:\/\//.test(web)?web:"",phone:ph,cuisine:t.cuisine||"",
             url:`https://www.openstreetmap.org/${hit.type}/${hit.id}`};
  return (out.hours||out.website||out.phone||out.cuisine) ? out : null;
}
async function fetchOsm(s){
  OSM[s.key]={state:"loading"}; updateCard(s);
  try{
    const r=await osmLookup(s);
    OSM[s.key]=r?{state:"ok",...r,ts:Date.now()}:{state:"none",ts:Date.now()};
    saveInfo();
  }catch(e){ OSM[s.key]={state:"error"}; }
  updateCard(s);
}
function prettyHours(h){
  const m={Mo:"Mon",Tu:"Tue",We:"Wed",Th:"Thu",Fr:"Fri",Sa:"Sat",Su:"Sun",PH:"Holidays"};
  return h.split(";").map(x=>x.trim().replace(/\b(Mo|Tu|We|Th|Fr|Sa|Su|PH)\b/g,w=>m[w])).filter(Boolean);
}
function osmHtml(s){
  if(!S.osmOpen.has(s.key)) return "";
  const i=OSM[s.key];
  if(!i||i.state==="loading") return "Looking up hours…";
  if(i.state==="error") return "Couldn't reach OpenStreetMap right now. Close this and tap again to retry.";
  if(i.state==="none") return "No hours or contact details are listed for this spot yet. Directions will still take you there.";
  let h="<ul>";
  if(i.hours) h+=`<li><b>Hours</b></li>`+prettyHours(i.hours).map(x=>`<li>${esc(x)}</li>`).join("");
  if(i.cuisine) h+=`<li><b>Serves</b> ${esc(i.cuisine.replace(/[;_]/g,", "))}</li>`;
  if(i.phone) h+=`<li><b>Phone</b> ${esc(i.phone)}</li>`;
  if(i.website) h+=`<li><a href="${esc(i.website)}" target="_blank" rel="noopener">Website</a></li>`;
  return h+`</ul><a href="${esc(i.url)}" target="_blank" rel="noopener">Source: OpenStreetMap</a>`;
}
function updateCard(s){
  const c=$("spot-"+s.id); if(!c||SPOTS[s.id]!==s) return;
  const a=c.querySelector("[data-about]"); if(a) a.innerHTML=aboutHtml(s);
  const o=c.querySelector("[data-osmbox]"); if(o) o.innerHTML=osmHtml(s);
  const b=c.querySelector("[data-osm]");
  if(b){ const open=S.osmOpen.has(s.key); b.textContent=open?"Hide hours & contact":"Hours & contact"; b.setAttribute("aria-expanded",open); }
}

function loadMine(){
  try{ const d=JSON.parse(localStorage.getItem(STORE)||"{}"); (d.override||[]).forEach(([k,v])=>S.override.set(k,v)); S.my=d.my||{}; }catch(e){}
}
let storageOk=true;
try{ localStorage.setItem(STORE+"-t","1"); localStorage.removeItem(STORE+"-t"); }catch(e){ storageOk=false; }
function saveMine(){
  if(!storageOk) return;
  try{ localStorage.setItem(STORE,JSON.stringify({override:[...S.override],my:S.my})); }catch(e){}
}
loadMine();
if(!storageOk){
  const w=document.createElement("div"); w.className="warn";
  w.textContent="This browser isn't allowing the app to save. Your visited spots, ratings and notes will reset when you close the page. Open the hosted link in Safari or Chrome (not Private mode, and not the file on your computer).";
  $("note").before(w);
}
initMap();
loadSheet();
setTimeout(()=>{map.invalidateSize();fit();},300);
addEventListener("resize",()=>map.invalidateSize());
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible" && SHEET_CSV_URL && Date.now()-lastLoad>60000) loadSheet();
});
</script>
</body>

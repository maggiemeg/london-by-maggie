<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maggie's London</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --ink:#12213A; --muted:#5E6A7E; --rule:#D9DEE6;
  --navy:#0B1F3A; --roundel:#DC241F;
  --food:#DC241F; --food-ink:#fff;
  --shop:#0019A8; --shop-ink:#fff;
  --nature:#007D32; --nature-ink:#fff;
  --sight:#FFD300; --sight-ink:#12213A;
  --night:#9B0058; --night-ink:#fff;
  --fun:#EE7C0E; --fun-ink:#12213A;
  --mapbg:#DDE3EA;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0D1524; --surface:#16213A; --ink:#EAF0FA; --muted:#9AA8C2; --rule:#27334F; --navy:#070E1B; --mapbg:#1B2638; }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow-x:hidden}
main,.panel,.app{min-width:0;width:100%}
body{
  font-family:"Gill Sans","Gill Sans MT","Trebuchet MS",Calibri,system-ui,sans-serif;
  background:var(--bg);color:var(--ink);font-size:16px;line-height:1.35;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--sight);outline-offset:2px}

.app{height:100dvh;display:flex;flex-direction:column;max-width:1200px;margin:0 auto}

/* header: station-sign bar */
header{background:var(--navy);color:#fff;padding:10px 14px calc(10px);flex-wrap:wrap;display:flex;align-items:center;gap:12px;flex-shrink:0}
.roundel{width:30px;height:30px;flex-shrink:0;position:relative;margin-left:6px}
.roundel i{position:absolute;inset:0;border:5px solid var(--roundel);border-radius:50%}
.roundel b{position:absolute;left:-4px;right:-4px;top:11px;height:9px;background:#1E4DB7;border-radius:1px}
header h1{font-size:19px;font-weight:700;letter-spacing:.2px;line-height:1.1}
header p{font-size:12.5px;opacity:.78}
.region{margin-left:auto;display:flex;background:rgba(255,255,255,.12);border-radius:999px;padding:3px}
.region button{padding:6px 12px;border-radius:999px;font-size:13.5px;font-weight:600;color:#fff;opacity:.8}
.region button[aria-pressed="true"]{background:#fff;color:var(--navy);opacity:1}

main{flex:1;min-height:0;display:flex;flex-direction:column}
#map{height:42dvh;min-height:240px;background:var(--mapbg);flex-shrink:0;z-index:0}
.panel{flex:1;min-height:0;overflow-y:auto;background:var(--bg);overscroll-behavior:contain}

/* filters */
.filters{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 6px;border-bottom:1px solid var(--rule)}
.row{display:flex;gap:7px;overflow-x:auto;padding:3px 14px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.row + .row{margin-top:4px}
.chip{
  flex-shrink:0;padding:6px 12px;border-radius:999px;background:var(--surface);
  border:1.5px solid var(--rule);font-size:14px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:6px
}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.hood{border-radius:4px;border-width:0 0 0 5px;border-left-style:solid;border-left-color:var(--navy);font-weight:600}
.chip.hood[aria-pressed="true"]{background:var(--navy);color:#fff;border-left-color:var(--roundel)}
.chip.sub{font-weight:500;font-size:13px;padding:4px 10px}

.tools{display:flex;gap:8px;align-items:center;padding:8px 14px 2px}
.tools input{
  flex:1;min-width:0;padding:8px 12px;border-radius:999px;border:1.5px solid var(--rule);
  background:var(--surface);color:var(--ink);font:inherit;font-size:15px
}
.tools button{
  padding:8px 13px;border-radius:999px;font-weight:700;font-size:14px;background:var(--surface);
  border:1.5px solid var(--rule);white-space:nowrap
}
.tools button.primary{background:var(--roundel);border-color:var(--roundel);color:#fff}
.tools button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}

.meta{display:flex;flex-wrap:wrap;gap:6px;justify-content:space-between;align-items:center;padding:10px 14px 4px;color:var(--muted);font-size:13.5px}
.meta button{color:var(--roundel);font-weight:700;font-size:13.5px}
.sync{display:block;font-size:12.5px;opacity:.85}
#note button{margin-left:6px;text-decoration:underline;color:var(--roundel);font-weight:700}
#note textarea{display:block;width:100%;margin-top:6px;font:inherit;font-size:12px;height:70px}
#note{margin:6px 14px 0;padding:8px 10px;border-radius:6px;background:var(--surface);border-left:4px solid var(--sight);font-size:13.5px;display:none}

/* spot cards: line-colour stripe on the left */
#list{list-style:none;padding:6px 14px calc(24px + env(safe-area-inset-bottom));display:grid;gap:10px}
.card{
  background:var(--surface);border-radius:8px;border-left:8px solid var(--c);
  padding:12px 12px 12px 14px;box-shadow:0 1px 0 var(--rule);
}
.card.sel{outline:2.5px solid var(--navy);outline-offset:1px}
.card.done .name{text-decoration:line-through;text-decoration-thickness:1.5px;opacity:.6}
.top{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.name{font-size:18px;font-weight:700;line-height:1.2}
.where{color:var(--muted);font-size:14px;margin-top:2px}
.dist{flex-shrink:0;font-size:13px;font-weight:700;background:var(--bg);padding:3px 8px;border-radius:999px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{font-size:12.5px;padding:2px 9px;border-radius:999px;font-weight:700;background:var(--c);color:var(--ci)}
.tag.plain{background:var(--bg);color:var(--ink);font-weight:500;border:1px solid var(--rule)}
.note-txt{margin-top:8px;font-size:15px}
.tube{margin-top:6px;font-size:13.5px;color:var(--muted)}
.acts{display:flex;gap:8px;margin-top:11px}
.acts a,.acts button{
  flex:1;text-align:center;text-decoration:none;padding:9px 10px;border-radius:7px;font-weight:700;font-size:14.5px;
  border:1.5px solid var(--navy);color:var(--ink);background:transparent;display:block
}
.acts a.go{background:var(--navy);color:#fff}
.acts button[aria-pressed="true"]{background:var(--nature);border-color:var(--nature);color:#fff}
.empty{text-align:center;padding:36px 20px;color:var(--muted)}
.empty button{margin-top:10px;padding:9px 16px;border-radius:999px;background:var(--navy);color:#fff;font-weight:700}

/* map pins */
.pin{background:none;border:0}
.pin span{
  display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:3px solid #fff;
  box-shadow:0 1px 4px rgba(0,0,0,.45);color:#fff;font-size:13px;font-weight:700
}
.pin.sel span{width:34px;height:34px;margin:-4px 0 0 -4px;border-color:var(--navy);box-shadow:0 0 0 3px #fff,0 2px 6px rgba(0,0,0,.5)}
.pin.done span{opacity:.55}
.card .price{margin-left:8px;color:var(--muted);font-weight:600}
.me{width:16px;height:16px;border-radius:50%;background:#1E7CF2;border:3px solid #fff;box-shadow:0 0 0 6px rgba(30,124,242,.25)}

@media (min-width:900px){
  main{flex-direction:row-reverse}
  #map{height:auto;flex:1;min-height:0}
  .panel{flex:0 0 440px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>

<div class="app">
  <header>
    <div class="roundel" aria-hidden="true"><i></i><b></b></div>
    <div>
      <h1>Maggie's London</h1>

    </div>
    <div class="region" role="group" aria-label="Region">
      <button data-region="London" aria-pressed="true">London</button>
      <button data-region="Beyond" aria-pressed="false">Beyond</button>
    </div>
  </header>

  <main>
    <section id="map" aria-label="Map of saved spots"></section>
    <section class="panel" id="panel">
      <div class="filters">
        <div class="row" id="zones" aria-label="Area"></div>
        <div class="row" id="hoods" aria-label="Neighbourhood"></div>
        <div class="row" id="cats" aria-label="Category"></div>
        <div class="row" id="subs" aria-label="Type"></div>
        <div class="tools">
          <input id="q" type="search" placeholder="Search spots" aria-label="Search spots">
          <button id="near">Near me</button>
          <button id="surprise" class="primary">Surprise me</button>
        </div>
      </div>
      <div class="meta"><div><span id="shown"></span><span id="sync" class="sync"></span></div><span><button id="refresh">Refresh</button> <button id="status"></button> <button id="clear">Clear</button></span></div>
      <div id="note" role="status"></div>
      <ul id="list"></ul>
    </section>
  </main>
</div>

/* ---------- CSV ---------- */
function parseCSV(t){
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){ if(c=='"'){ if(t[i+1]=='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c=='"') q=true;
    else if(c==','){row.push(f);f="";}
    else if(c=='\n'||c=='\r'){ if(c=='\r'&&t[i+1]=='\n') i++; row.push(f);rows.push(row);row=[];f=""; }
    else f+=c;
  }
  if(f!==""||row.length){row.push(f);rows.push(row);}
  return rows;
}
const ALIASES = {
  name:["place name","name","place"], hood:["location","neighborhood","neighbourhood","area"],
  cat:["category"], sub:["subcategory","sub-category","sub category","type"],
  link:["google map link","google maps link","map link","link"], note:["notes","note"],
  visited:["visited?","visitied?","visited","visit"], lat:["lat","latitude"], lng:["lng","lon","long","longitude"],
  region:["region"], zone:["zone"], price:["price"], tube:["nearest station","station","tube"]
};
function sheetToSpots(table){
  const head = table[0].map(h=>h.trim().toLowerCase());
  const idx = {};
  for(const k in ALIASES){ idx[k] = head.findIndex(h=>ALIASES[k].includes(h)); }
  const get = (r,k)=> idx[k]>=0 ? (r[idx[k]]||"").trim() : "";
  const out=[];
  table.slice(1).forEach((r,n)=>{
    const name=get(r,"name"); if(!name) return;
    const hood=get(r,"hood"), link=get(r,"link");
    let lat=parseFloat(get(r,"lat")), lng=parseFloat(get(r,"lng"));
    if(isNaN(lat)||isNaN(lng)){ const m=link.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||link.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/); lat=m?+m[1]:NaN; lng=m?+m[2]:NaN; }
    out.push(makeSpot({name,hood,cats:get(r,"cat").split(/[,\n]/).map(x=>x.trim()).filter(Boolean),subs:get(r,"sub").split(/[,\n]/).map(s=>s.trim()).filter(Boolean),
      note:get(r,"note"),link,lat,lng,region:get(r,"region"),zone:get(r,"zone"),price:get(r,"price"),tube:get(r,"tube"),
      sheetVisited:/^(yes|y|true|visited|done|✓|x)/i.test(get(r,"visited")),src:n,fromSheet:true}));
  });
  return {spots:out,nData:table.length-1};
}
function makeSpot(o){
  const h=(o.hood||"").toLowerCase();
  let zone=o.zone, region=o.region;
  if(!region){
    const inLondon = Object.values(ZONE_KEYS).some(a=>a.some(k=>h.includes(k)));
    region = inLondon ? "London" : (BEYOND_KEYS.some(k=>h.includes(k)) ? "Beyond" : "London");
  }
  region = /^lon/i.test(region) ? "London" : "Beyond";
  if(region==="London" && !zone){
    zone = Object.keys(ZONE_KEYS).find(z=>ZONE_KEYS[z].some(k=>h.includes(k))) || "Other";
  }
  if(region==="Beyond") zone="—";
  const known = SAMPLE_BY_NAME[(o.link||"").trim().toLowerCase()] || SAMPLE_BY_NAME[o.name.trim().toLowerCase()];
  let lat=o.lat, lng=o.lng, approx=false;
  if((isNaN(lat)||isNaN(lng)) && known){ lat=known.lat; lng=known.lng; }
  if(!o.tube && known) o.tube=known.tube;
  return {name:o.name,hood:o.hood||"Unsorted",zone,region,cat:(o.cats&&o.cats[0])||o.cat||"Other",cats:(o.cats&&o.cats.length?o.cats:[o.cat||"Other"]),subs:o.subs||[],note:o.note||"",
    lat:isNaN(lat)?null:lat,lng:isNaN(lng)?null:lng,tube:o.tube||"",link:o.link||"",price:o.price||"",
    sheetVisited:!!o.sheetVisited,src:o.src,hadSheetCoords:o.fromSheet&&!isNaN(o.lat)&&!isNaN(o.lng),
    key:(o.name+"|"+(o.hood||"")+"|"+((o.cats&&o.cats[0])||o.cat||"")).toLowerCase()};
}

let map, markers = {}, meMarker, tilesOk = false;
function initMap(){
  map = L.map("map").setView([51.515,-0.13],11);
  const hosted = /^https?:/.test(location.protocol);
  const carto = () => L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",{
    maxZoom:19,subdomains:"abcd",attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; CARTO'
  });
  // OpenStreetMap's own servers refuse pages opened straight from a file, so use the same map data via CARTO there
  if(!hosted){ carto().addTo(map); return; }
  const osm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{
    maxZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);
  let failed=0;
  osm.on("tileload",()=>{tilesOk=true});
  osm.on("tileerror",()=>{ if(tilesOk||++failed<3) return; map.removeLayer(osm); carto().addTo(map); });
}
function pinIcon(s){
  const done=isVisited(s), c=cs(s.cat);
  return L.divIcon({className:"pin"+(S.sel===s.id?" sel":"")+(done?" done":""),
    html:`<span style="background:${c.c};color:${c.i}">${done?"✓":""}</span>`,iconSize:[26,26],iconAnchor:[13,13]});
}
function addMarker(s){
  if(s.lat==null) return;
  if(markers[s.id]) map.removeLayer(markers[s.id]);
  const m=L.marker([s.lat,s.lng],{icon:pinIcon(s),title:s.name,keyboard:true});
  m.on("click",()=>select(s.id,true,false));
  markers[s.id]=m;
}

/* ---------- FILTERING ---------- */
const inRegion = s => S.region==="London" ? s.region==="London" : s.region!=="London";
function filtered(extra={}){
  const f={...S,...extra}, q=f.q.trim().toLowerCase();
  const out=SPOTS.filter(s=>{
    if(!inRegion(s)) return false;
    if(S.region==="London" && f.zone!=="All" && s.zone!==f.zone) return false;
    if(f.hood!=="All" && s.hood!==f.hood) return false;
    if(f.cat!=="All" && !s.cats.includes(f.cat)) return false;
    if(f.sub!=="All" && !s.subs.includes(f.sub)) return false;
    const v=isVisited(s);
    if(f.status==="todo" && v) return false;
    if(f.status==="done" && !v) return false;
    if(q && !(s.name+" "+s.hood+" "+s.note+" "+s.subs.join(" ")+" "+s.cats.join(" ")).toLowerCase().includes(q)) return false;
    return true;
  });
  if(S.user){
    out.forEach(s=>{s._d = s.lat==null?Infinity:dist(S.user,[s.lat,s.lng]);});
    if(S.near) out.sort((a,b)=>a._d-b._d);
  }
  return out;
}
function dist(a,b){
  const R=6371000,t=Math.PI/180,dLat=(b[0]-a[0])*t,dLng=(b[1]-a[1])*t;
  const h=Math.sin(dLat/2)**2+Math.cos(a[0]*t)*Math.cos(b[0]*t)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function distLabel(m){
  if(!isFinite(m)) return "";
  if(m>50000) return Math.round(m/1000)+" km";
  const mins=Math.max(1,Math.round(m/80));
  return mins<=45 ? mins+" min walk" : (m/1000).toFixed(1)+" km";
}

/* ---------- RENDER ---------- */
function chip(kind,label,val,active,extra=""){
  return `<button class="chip ${kind}" data-k="${kind}" data-v="${esc(val)}" aria-pressed="${active}">${extra}${esc(label)}</button>`;
}
function renderFilters(){
  const base=SPOTS.filter(inRegion);
  const zones=ZONE_ORDER.filter(z=>base.some(s=>s.zone===z));
  $("zones").style.display=S.region==="London"?"flex":"none";
  $("zones").innerHTML=chip("zone","All London","All",S.zone==="All")+zones.map(z=>chip("zone",z,z,S.zone===z)).join("");
  const hoodSpots=base.filter(s=>S.region!=="London"||S.zone==="All"||s.zone===S.zone);
  const hoods=[...new Set(hoodSpots.map(s=>s.hood))].sort();
  $("hoods").innerHTML=chip("hood","All areas","All",S.hood==="All")+hoods.map(h=>chip("hood",h,h,S.hood===h)).join("");
  const present=[...new Set(base.flatMap(s=>s.cats))];
  const cats=[...Object.keys(CAT).filter(c=>present.includes(c)),...present.filter(c=>!CAT[c])];
  $("cats").innerHTML=chip("cat","Everything","All",S.cat==="All")+
    cats.map(c=>chip("cat",c,c,S.cat===c,`<span class="dot" style="background:${cs(c).c}"></span>`)).join("");
  if(S.cat!=="All"){
    const subs=[...new Set(base.filter(s=>s.cats.includes(S.cat)).flatMap(s=>s.subs))].sort();
    $("subs").style.display="flex";
    $("subs").innerHTML=chip("sub","All types","All",S.sub==="All")+subs.map(x=>chip("sub",x,x,S.sub===x)).join("");
  } else $("subs").style.display="none";
  $("near").setAttribute("aria-pressed",S.near);
  $("status").textContent={all:"All",todo:"Not yet",done:"Visited"}[S.status];
}
function renderList(){
  const list=filtered();
  $("shown").textContent=`${list.length} of ${SPOTS.filter(inRegion).length} spots`;
  const vis=SPOTS.filter(isVisited).length;
  $("count").textContent=`${vis} visited · ${SPOTS.length-vis} still to go`;
  if(!list.length){
    $("list").innerHTML=`<li class="empty">Nothing matches those filters.<br><button id="clear2">Clear filters</button></li>`;
    $("clear2").onclick=clearFilters;
  } else {
    $("list").innerHTML=list.map(s=>{
      const v=isVisited(s), c=cs(s.cat);
      const dir=/^https?:\/\//.test(s.link) ? s.link
        : "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(s.name+" "+(s.region==="London"?"London":s.hood));
      return `<li class="card ${S.sel===s.id?"sel":""} ${v?"done":""}" id="spot-${s.id}" data-id="${s.id}" style="--c:${c.c};--ci:${c.i}">

        </div>
        <div class="tags">${s.cats.map(x=>`<span class="tag" style="background:${cs(x).c};color:${cs(x).i}">${esc(x)}</span>`).join("")}${s.subs.map(x=>`<span class="tag plain">${esc(x)}</span>`).join("")}</div>
        ${s.note?`<p class="note-txt">${esc(s.note)}</p>`:""}
        ${s.tube?`<p class="tube">Nearest station: ${esc(s.tube)}</p>`:""}
        ${s.lat==null?`<p class="tube">Finding this spot on the map…</p>`:""}
        <div class="acts">
          <a class="go" href="${esc(dir)}" target="_blank" rel="noopener">Get directions</a>
          <button data-visit="${s.id}" aria-pressed="${v}">${v?"Visited":"Mark visited"}</button>
        </div>
      </li>`;
    }).join("");
  }
  const ids=new Set(list.map(s=>s.id));
  SPOTS.forEach(s=>{
    const m=markers[s.id]; if(!m) return;
    if(ids.has(s.id)){ m.setIcon(pinIcon(s)); if(!map.hasLayer(m)) m.addTo(map); m.setZIndexOffset(S.sel===s.id?1000:0); }
    else if(map.hasLayer(m)) map.removeLayer(m);
  });
}
function fit(){
  const list=filtered().filter(s=>s.lat!=null);
  if(!list.length) return;
  if(list.length===1) return map.setView([list[0].lat,list[0].lng],15);
  const pts=list.map(s=>[s.lat,s.lng]);
  if(S.user) pts.push(S.user);
  map.fitBounds(L.latLngBounds(pts).pad(0.15),{maxZoom:15});
}
function refresh(doFit=true){ renderFilters(); renderList(); if(doFit) fit(); }

function select(id,scroll,fly){

  if(scroll){ const el=$("spot-"+id); if(el) el.scrollIntoView({behavior:"smooth",block:"center"}); }
}

    const k=chipEl.dataset.k,v=chipEl.dataset.v;
    if(k==="zone"){S.zone=v;S.hood="All";}
    if(k==="hood") S.hood=v;
    if(k==="cat"){S.cat=v;S.sub="All";}
    if(k==="sub") S.sub=v;

    if(meMarker) map.removeLayer(meMarker);
    meMarker=L.marker(S.user,{icon:L.divIcon({className:"",html:'<div class="me"></div>',iconSize:[16,16]}),interactive:false}).addTo(map);
    refresh(false); map.setView(S.user,14);
  },()=>showNote("Couldn't get your location. Check that location access is on for this page, or pick an area above."),{enableHighAccuracy:true,timeout:10000});
};

/* ---------- LOADING FROM THE SHEET ---------- */
let gen=0, lastLoad=0, nData=0, fromSheet=false;
function setSpots(list){
  Object.values(markers).forEach(m=>map.removeLayer(m)); markers={};
  SPOTS=list; SPOTS.forEach((s,i)=>{s.id=i; addMarker(s);});
  S.sel=null;
  if(S.cat!=="All" && !SPOTS.some(s=>s.cats.includes(S.cat))) S.cat="All";
  refresh(true);
}
async function loadSheet(manual){
  const my=++gen; hideNote();
  if(!SHEET_CSV_URL){
    fromSheet=false; const sn=sheetToSpots(parseCSV(SNAPSHOT_CSV)); setSpots(sn.spots);
    $("sync").textContent="Showing a saved copy of your sheet.";
    return;
  }
  $("sync").textContent="Syncing…";
  try{
    const res=await fetch(SHEET_CSV_URL+(SHEET_CSV_URL.includes("?")?"&":"?")+"_="+Date.now(),{cache:"no-store"});
    if(!res.ok) throw new Error(res.status);
    const parsed=sheetToSpots(parseCSV(await res.text()));
    if(my!==gen) return;
    if(!parsed.spots.length) throw new Error("empty");
    nData=parsed.nData; fromSheet=true; lastLoad=Date.now();
    setSpots(parsed.spots);
    $("sync").textContent="Synced "+new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})+" · "+parsed.spots.length+" spots from your sheet";
    geocodeMissing(my);
  }catch(err){
    if(my!==gen) return;
    if(fromSheet){
      $("sync").textContent="Couldn't refresh. Showing the last synced spots.";
    } else {
      const snap=sheetToSpots(parseCSV(SNAPSHOT_CSV));
      setSpots(snap.spots);
      $("sync").textContent="Showing a saved copy of your sheet from "+SNAPSHOT_DATE+" ("+snap.spots.length+" spots). Live updates need the page hosted online.";
    }
  }
}

/* Spots with no coordinates get looked up on OpenStreetMap, one per second */
async function geocodeMissing(my){
  const todo=SPOTS.filter(s=>s.lat==null);
  let added=0;
  for(const s of todo){
    if(my!==gen) return;
    const qs=[s.name+", "+s.hood+(s.region==="London"?", London":""), s.name+(s.region==="London"?", London":"")];
    for(const q of qs){
      try{
        const r=await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=gb&q="+encodeURIComponent(q));
        const j=await r.json();
        if(j[0]){ s.lat=+j[0].lat; s.lng=+j[0].lon; added++; addMarker(s); renderList(); break; }
      }catch(e){ break; }
      await new Promise(r=>setTimeout(r,1100));
    }
    await new Promise(r=>setTimeout(r,1100));
  }
  if(my!==gen) return;
  if(added || todo.length){ fit(); }
  offerCoordCopy();
}
function offerCoordCopy(){
  const needs=SPOTS.some(s=>s.lat!=null && !s.hadSheetCoords);
  if(!needs || !fromSheet) return;
  const lines=Array.from({length:nData},()=>"\t");
  SPOTS.forEach(s=>{ if(s.lat!=null && s.src!=null) lines[s.src]=s.lat.toFixed(6)+"\t"+s.lng.toFixed(6); });
  const text="Lat\tLng\n"+lines.join("\n");
  const b=document.createElement("button"); b.textContent="Copy coordinates";
  b.onclick=async()=>{
    try{ await navigator.clipboard.writeText(text); b.textContent="Copied. Paste into new Lat and Lng columns."; }
    catch(e){ const t=document.createElement("textarea"); t.value=text; $("note").appendChild(t); t.select(); }
  };
  showNote("Some pins were placed automatically, so they load slowly. Save their coordinates in your sheet to make them instant.",b);
}

initMap();
loadSheet();
setTimeout(()=>{map.invalidateSize();fit();},300);
addEventListener("resize",()=>map.invalidateSize());
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible" && SHEET_CSV_URL && Date.now()-lastLoad>60000) loadSheet();
});
</script>
